<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ケラバ図メーカー</title>
<meta name="theme-color" content="#124680">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ケラバ図">
<style>
  :root{
    --bg:#eef1f5; --panel:#ffffff; --line:#d5dce5; --ink:#1c2430; --sub:#5b6878;
    --accent:#1b6fd4; --accent2:#124680;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Yu Gothic UI","Meiryo","Hiragino Kaku Gothic ProN","MS PGothic",sans-serif;
    font-size:13px;
  }
  .app{display:flex;height:100vh;overflow:hidden}

  /* ---------- 左パネル ---------- */
  .side{
    width:525px;min-width:525px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;
  }
  .side header{padding:15px 18px 13px;border-bottom:1px solid var(--line)}
  .side header h1{margin:0;font-size:21px;letter-spacing:.04em}
  .side header p{margin:4px 0 0;font-size:14px;color:var(--sub)}
  #ver{color:#9aa7b6}
  #updBar{display:none;padding:10px 18px;background:#fff6d8;border-bottom:1px solid #e8d48a;
          font-size:16px;color:#6b4e00;cursor:pointer}
  #updBar b{color:#8a5b00}
  @media print{ #updBar{display:none!important} }
  .mode-tabs{display:flex;gap:8px;padding:10px 18px;border-bottom:1px solid var(--line);background:#f8fafc}
  .mode-tab{flex:1;font-size:17px;font-weight:700;padding:9px 12px;color:var(--sub);background:#fff}
  .mode-tab.is-active{color:#fff;background:var(--accent);border-color:var(--accent)}
  .mode-tab.is-active:hover{background:var(--accent2);border-color:var(--accent2)}
  .file-tools{padding:9px 18px;border-bottom:1px solid var(--line);background:#f8fafc}
  .file-buttons{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .file-buttons button{min-width:88px;font-weight:700}
  .file-buttons a{margin-left:auto;color:var(--accent2);font-size:15px;font-weight:700}
  .file-status{margin:6px 0 0;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
  .file-status:empty{display:none}
  .file-status.is-error{color:#a51919;font-weight:700}
  #btnUndoOpen{margin-top:6px;font-size:14px}
  #projectSaveDialog{width:460px;max-width:94vw;border:1px solid var(--line);border-radius:8px;padding:22px}
  #projectSaveDialog::backdrop{background:#1c243050}
  #projectSaveDialog h2{margin:0 0 18px;font-size:21px}
  #projectSaveDialog label{display:block;font-size:16px;font-weight:700}
  #projectSaveName{display:block;width:100%;margin-top:7px;font-size:19px}
  #projectSaveError{color:#a51919;font-size:15px}
  .project-save-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
  .scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:13px 18px 39px}

  fieldset{border:1px solid var(--line);border-radius:6px;margin:0 0 18px;padding:13px 16px 16px;
           min-inline-size:0;min-width:0}
  legend{font-size:17px;font-weight:700;color:var(--accent2);padding:0 8px;letter-spacing:.06em}
  .row{display:flex;align-items:center;gap:9px;margin:9px 0;min-width:0}
  .row label{flex:0 0 203px;font-size:18px;color:var(--ink);font-weight:600}
  .row.wide label{flex:0 0 100%}
  input[type=text],input[type=number],select,textarea{
    flex:1 1 0;min-width:0;width:0;padding:7px 9px;border:1px solid var(--line);border-radius:5px;
    font-family:inherit;font-size:18px;background:#fbfcfe;color:var(--ink);
  }
  input[type=number]{text-align:right}
  .row.slider{gap:12px;margin:12px 0 6px}
  .row.slider input[type=range]{flex:1 1 auto;min-width:0;height:28px;accent-color:var(--accent);cursor:pointer}
  .slend{flex:0 0 auto;font-size:16px;font-weight:600;color:var(--sub)}
  input:focus,select:focus,textarea:focus{outline:2px solid #bcd8f7;border-color:var(--accent)}
  input:disabled,select:disabled,button:disabled{
    background:#eef1f5;color:#a3aebc;border-color:#e2e7ee;cursor:not-allowed}
  .row.off label{color:#a3aebc}
  .row.off .unit{color:#a3aebc}
  .sizepair{display:flex;align-items:center;gap:7px;flex:1 1 0;min-width:0}
  .sizepair input[type=number]{flex:1 1 0;min-width:0;width:0}
  .sizepair .times{flex:0 0 auto;font-size:20px;font-weight:700;color:var(--sub)}
  .material-row > label:first-child{flex:0 0 168px}
  .row label.fixcheck{display:flex;align-items:center;gap:4px;flex:0 0 auto;font-size:14px;font-weight:700;color:var(--sub);white-space:nowrap}
  .fixcheck input{width:17px;height:17px;margin:0}
  .print-warning{display:none;flex:0 0 100%;padding:10px 12px;margin:0 0 4px;
                 border:2px solid #c72323;border-radius:6px;background:#fff0f0;color:#9d1515;
                 font-size:16px;font-weight:700;line-height:1.45}
  .print-warning.is-visible{display:block}
  .print-warning-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .print-warning ul{margin:7px 0 0;padding-left:1.3em}
  .print-warning li+li{margin-top:4px}
  .print-warning label{display:flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap}
  .print-warning input{width:19px;height:19px;margin:0;accent-color:#a51919}
  textarea{resize:vertical;min-height:52px;line-height:1.5}
  .unit{flex:0 0 36px;font-size:16px;color:var(--ink)}
  .chk{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--ink);padding:5px 0;
       flex:0 0 calc(50% - 6px);min-width:0;line-height:1.35}
  .chk input{margin:0;flex:0 0 auto;width:17px;height:17px}
  .chkgrid{display:flex;flex-wrap:wrap;gap:0 12px}
  .boxgrp{background:#f6f8fb;border:1px solid #e4eaf2;border-radius:6px;
          padding:7px 11px 9px;margin:0 0 9px}
  .boxgrp > b{display:block;font-size:14px;color:var(--sub);font-weight:700;
              margin:0 0 3px;letter-spacing:.04em}
  .boxgrp:last-child{margin-bottom:0}
  .hint{font-size:14px;color:var(--sub);line-height:1.6;margin:6px 0 0}
  .offset-group{padding:10px 12px;margin:0 0 10px;background:#f6f8fb;border:1px solid #e4eaf2;border-radius:6px}
  .offset-group:last-child{margin-bottom:0}
  .offset-group b{display:block;margin:0 0 7px;font-size:16px;color:var(--accent2)}
  .offset-grid{display:grid;grid-template-columns:1.05fr 1.25fr .7fr .8fr auto;gap:7px;align-items:center}
  .offset-grid.no-side{grid-template-columns:1.05fr 1.25fr 1fr auto}
  .offset-grid select,.offset-grid input{width:100%;min-width:0;padding:6px 7px;font-size:16px}
  .offset-grid .unit{width:auto;flex:none;font-size:15px}
  .tile-only{display:none}
  body.tile-mode .tile-only{display:block}
  body.tile-mode .row.tile-only{display:flex}
  body.tile-mode .normal-only{display:none}
  .tile-inline{display:none}
  body.tile-mode .tile-inline{display:inline-flex}

  button{
    font-family:inherit;font-size:16px;padding:8px 13px;border-radius:6px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--ink);
  }
  button:hover{background:#f2f6fb;border-color:#b9c8da}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  button.primary:hover{background:var(--accent2)}
  button.primary:disabled,button.primary:disabled:hover{
    background:#eef1f5;color:#a3aebc;border-color:#e2e7ee;cursor:not-allowed}

  .side footer{border-top:1px solid var(--line);padding:13px 18px;display:flex;gap:8px;flex-wrap:wrap;background:#f8fafc}
  .side footer button{flex:1}

  /* ---------- 右プレビュー ---------- */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .toolbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .toolbar .sp{flex:1}
  .toolbar .zoom{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--sub)}
  .stage{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;align-items:center;gap:22px}
  .sheetwrap{position:relative;flex:0 0 auto}
  .sheet{background:#fff;box-shadow:0 3px 16px rgba(20,40,70,.20);transform-origin:top left}
  .sheet svg{display:block}

  /* ---------- 印刷 ---------- */
  @media print{
    html,body{background:#fff;height:auto;overflow:visible}
    .app{display:block;height:auto;overflow:visible}
    .side,.toolbar{display:none!important}
    .main{display:block;overflow:visible}
    .stage{padding:0;gap:0;display:block}
    .sheetwrap{height:auto!important;width:auto!important}
    .sheet{box-shadow:none;transform:none!important;break-after:auto;page-break-after:auto;
           -webkit-print-color-adjust:exact;print-color-adjust:exact}
    body.p-dwg .w-ord{display:none!important}
    body.p-ord .w-dwg{display:none!important}
    /* 2枚まとめて出すときだけ、1枚目の後で改ページする */
    body.p-both .w-dwg .sheet{break-after:page;page-break-after:always}
  }
</style>
<style id="pageStyle"></style>
</head>
<body>
<div class="app">

  <!-- ============ 入力 ============ -->
  <div class="side">
    <header>
      <h1>ケラバ図メーカー</h1>
      <p>数値を入れるとリアルタイムで作図 → A4でPDF出力　<span id="ver"></span></p>
    </header>

    <div id="updBar">新しいバージョンがあります。<b>ここをクリックして更新</b></div>

    <div class="mode-tabs" role="tablist" aria-label="屋根材の種類">
      <button class="mode-tab is-active" id="tabNormal" type="button" role="tab" aria-selected="true">通常</button>
      <button class="mode-tab" id="tabTile" type="button" role="tab" aria-selected="false">瓦</button>
    </div>

    <div class="file-tools">
      <div class="file-buttons">
        <button id="btnSaveProject" type="button">保存</button>
        <button id="btnOpenProject" type="button">開く</button>
        <a href="https://github.com/miyagoshigotono-lgtm/keraba-project-data" target="_blank" rel="noopener noreferrer" title="GitHubの非公開保存先を開く">共有データ</a>
      </div>
      <input id="projectFile" type="file" accept=".json,application/json" hidden aria-label="ケラバの保存ファイル">
      <p id="fileStatus" class="file-status" role="status" aria-live="polite"></p>
      <button id="btnUndoOpen" type="button" hidden>読み込み前に戻す</button>
    </div>

    <div class="scroll" id="form">

      <fieldset>
        <legend>物件情報</legend>
        <div class="row"><label>邸名</label><input type="text" id="name" value="" placeholder="◯◯様邸"></div>
        <div class="row"><label>屋根勾配</label><input type="number" id="pitch" value="1.0" step="0.1" min="0.1" max="12"><span class="unit">寸</span></div>
        <div class="row"><label>屋根材・色</label><input type="text" id="material" value="ガルバリウム"></div>
        <div class="row"><label>破風板</label>
          <select id="hafu">
            <option value="on" selected>有り</option>
            <option value="none">無し</option>
          </select>
        </div>
        <div class="row"><label>鼻隠し板（水下）</label>
          <select id="hanaShimo">
            <option value="tatsu" selected>タツ</option>
            <option value="kane">カネ</option>
            <option value="cut2">勾配カット(上下)</option>
            <option value="cut1">勾配カット(上部のみ)</option>
            <option value="none">無し</option>
          </select>
        </div>
        <div class="row"><label>鼻隠し板（水上）</label>
          <select id="hanaKami">
            <option value="tatsu" selected>タツ</option>
            <option value="kane">カネ</option>
            <option value="cut2">勾配カット(上下)</option>
            <option value="cut1">勾配カット(上部のみ)</option>
            <option value="none">無し</option>
          </select>
        </div>
        <div class="row"><label>宛先</label><input type="text" id="client" value=""></div>
      </fieldset>

      <fieldset>
        <legend>部材寸法（前提条件）</legend>
        <div class="row"><label>合板 厚</label><input type="number" id="tNoji" value="12" step="0.5"><span class="unit">mm</span></div>
        <div class="row"><label>垂木 成</label><input type="number" id="hTaruki" value="60" step="1"><span class="unit">mm</span></div>
        <input type="hidden" id="tHafu" value="30">
        <input type="hidden" id="wHafu" value="150">
        <input type="hidden" id="tHana" value="30">
        <input type="hidden" id="hHanaKamiOrder" value="">
        <input type="hidden" id="hHanaShimoOrder" value="">
        <input type="hidden" id="tileHanaSOrder" value="175">
        <input type="checkbox" id="fixHafu" checked hidden aria-hidden="true">
        <input type="checkbox" id="fixHanaKami" hidden aria-hidden="true">
        <input type="checkbox" id="fixHanaShimo" hidden aria-hidden="true">

        <div class="normal-only">
          <div class="row material-row"><label>破風板</label><div class="sizepair"><input type="number" id="normalHafuWidth" data-material-for="tHafu" step="1" aria-label="破風板の巾"><span class="times">ｘ</span><input type="number" id="normalHafuHeight" data-material-for="wHafu" step="1" aria-label="破風板の成"></div><label class="fixcheck"><input type="checkbox" data-fixed-for="fixHafu">固定</label></div>
          <div class="row material-row"><label>鼻隠し（水上）</label><div class="sizepair"><input type="number" id="normalHanaKamiWidth" data-material-for="tHana" step="1" aria-label="水上鼻隠しの巾"><span class="times">ｘ</span><input type="number" id="normalHanaKamiHeight" data-material-for="hHanaKamiOrder" step="0.1" aria-label="水上鼻隠しの成"></div><label class="fixcheck"><input type="checkbox" data-fixed-for="fixHanaKami">固定</label></div>
          <div class="row material-row"><label>鼻隠し（水下）</label><div class="sizepair"><input type="number" id="normalHanaShimoWidth" data-material-for="tHana" step="1" aria-label="水下鼻隠しの巾"><span class="times">ｘ</span><input type="number" id="normalHanaShimoHeight" data-material-for="hHanaShimoOrder" step="0.1" aria-label="水下鼻隠しの成"></div><label class="fixcheck"><input type="checkbox" data-fixed-for="fixHanaShimo">固定</label></div>
        </div>

        <div class="tile-only">
          <div class="row material-row"><label>鼻隠し（水下）</label><div class="sizepair"><input type="number" id="tileHanaShimoWidth" data-material-for="tHana" step="1" aria-label="水下鼻隠しの巾"><span class="times">ｘ</span><input type="number" id="tileHanaShimoHeight" data-material-for="hHanaShimoOrder" step="1" aria-label="水下鼻隠しの成"></div><label class="fixcheck"><input type="checkbox" data-fixed-for="fixHanaShimo">固定</label></div>
          <div class="row material-row"><label>破風板</label><div class="sizepair"><input type="number" id="tileHafuWidth" data-material-for="tHafu" step="1" aria-label="破風板の巾"><span class="times">ｘ</span><input type="number" id="tileHafuHeight" data-material-for="wHafu" step="1" aria-label="破風板の成"></div><label class="fixcheck"><input type="checkbox" data-fixed-for="fixHafu">固定</label></div>
          <div class="row material-row"><label>鼻隠し（水上）</label><div class="sizepair"><input type="number" id="tileHanaKamiWidth" data-material-for="tHana" step="1" aria-label="水上鼻隠しの巾"><span class="times">ｘ</span><input type="number" id="tileHanaKamiHeight" data-material-for="hHanaKamiOrder" step="1" aria-label="水上鼻隠しの成"></div><label class="fixcheck"><input type="checkbox" data-fixed-for="fixHanaKami">固定</label></div>
        </div>
        <input type="checkbox" id="tileHafuAuto" checked hidden aria-hidden="true">
      </fieldset>

      <fieldset class="tile-only" id="tileOffsets">
        <legend>瓦：天端オフセット</legend>
        <div class="offset-group" data-offset-part="hafu">
          <b>破風板 天端</b>
          <div class="offset-grid no-side">
            <select id="tileHafuRef" aria-label="破風板の基準"><option value="noji">合板天端</option><option value="taruki">垂木天端</option></select>
            <select id="tileHafuDir" aria-label="破風板の方向"><option value="vertical">鉛直</option><option value="perpendicular" selected>勾配に垂直</option></select>
            <input type="number" id="tileHafuOffset" value="20" step="1" aria-label="破風板のオフセット">
            <span class="unit">mm</span>
          </div>
        </div>
        <div class="offset-group" data-offset-part="hanaShimo">
          <b>水下鼻隠し 天端</b>
          <div class="offset-grid">
            <select id="tileHanaSRef" aria-label="水下鼻隠しの基準"><option value="noji">合板天端</option><option value="taruki">垂木天端</option></select>
            <select id="tileHanaSDir" aria-label="水下鼻隠しの方向"><option value="vertical">鉛直</option><option value="perpendicular">勾配に垂直</option></select>
            <select id="tileHanaSSide" aria-label="水下鼻隠しの基準面"><option value="inner" selected>内寸</option><option value="outer">外寸</option></select>
            <input type="number" id="tileHanaSOffset" value="40" step="1" aria-label="水下鼻隠しのオフセット">
            <span class="unit">mm</span>
          </div>
        </div>
        <div class="offset-group" data-offset-part="hanaKami">
          <b>水上鼻隠し 天端</b>
          <div class="offset-grid">
            <select id="tileHanaKRef" aria-label="水上鼻隠しの基準"><option value="noji">合板天端</option><option value="taruki">垂木天端</option></select>
            <select id="tileHanaKDir" aria-label="水上鼻隠しの方向"><option value="vertical">鉛直</option><option value="perpendicular">勾配に垂直</option></select>
            <select id="tileHanaKSide" aria-label="水上鼻隠しの基準面"><option value="inner" selected>内寸</option><option value="outer">外寸</option></select>
            <input type="number" id="tileHanaKOffset" value="40" step="1" aria-label="水上鼻隠しのオフセット">
            <span class="unit">mm</span>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>母屋</legend>
        <div class="row"><label>母屋 寸法（角）</label><input type="number" id="moyaSize" value="105" step="1"><span class="unit">mm</span></div>
        <div class="row"><label>垂木欠き（母屋芯から）</label><input type="number" id="notchRef" value="22.5" step="0.5"><span class="unit">mm</span></div>
      </fieldset>

      <fieldset>
        <legend>合板の出</legend>
        <div class="row"><label>合板の出（水下）</label><input type="number" id="ovShimo" value="82" step="1"><span class="unit">mm</span></div>
        <div class="row"><label>合板の出（水上）</label><input type="number" id="ovKami" value="58" step="1"><span class="unit">mm</span></div>
      </fieldset>

      <fieldset>
        <legend>ケラバカット</legend>
        <div class="row"><label>クリアランス</label><input type="number" id="clearance" value="0" step="1" min="0"><span class="unit">mm</span></div>
      </fieldset>

      <fieldset>
        <legend>表示・寸法線</legend>
        <div class="boxgrp"><b>鼻隠し</b><div class="chkgrid">
          <label class="chk"><input type="checkbox" id="dHana" checked>鼻隠し寸法</label>
          <label class="chk"><input type="checkbox" id="dThick" checked>鼻隠し厚</label>
        </div></div>

        <div class="boxgrp"><b>勾配直角の寸法</b><div class="chkgrid">
          <label class="chk"><input type="checkbox" id="dHafuW" checked>破風板寸法</label>
          <label class="chk"><input type="checkbox" id="dTaruki" checked>垂木成</label>
          <label class="chk"><input type="checkbox" id="dNoji" checked>合板厚</label>
        </div></div>

        <div class="boxgrp"><b>合板の出</b><div class="chkgrid">
          <label class="chk"><input type="checkbox" id="dOverS" checked>水下合板寸法</label>
          <label class="chk"><input type="checkbox" id="dOverK" checked>水上合板寸法</label>
        </div></div>

        <div class="boxgrp"><b>母屋</b><div class="chkgrid">
          <label class="chk"><input type="checkbox" id="dMoyaW" checked>母屋寸法</label>
          <label class="chk"><input type="checkbox" id="dCenter" checked>母屋芯線</label>
          <label class="chk"><input type="checkbox" id="d225" checked>芯から22.5</label>
        </div></div>

        <div class="boxgrp"><b>ケラバカット</b><div class="chkgrid">
          <label class="chk"><input type="checkbox" id="dHatch" checked>ケラバカット</label>
          <label class="chk"><input type="checkbox" id="dMoya" checked>ケラバカット寸法</label>
          <label class="chk"><input type="checkbox" id="dShort" checked>同（短い方）</label>
          <label class="chk"><input type="checkbox" id="dClear" checked>クリアランス寸法</label>
        </div></div>

        <div class="boxgrp"><b>その他</b><div class="chkgrid">
          <label class="chk"><input type="checkbox" id="dSlope" checked>勾配マーク</label>
        </div></div>
      </fieldset>

      <fieldset>
        <legend>スケール</legend>
        <div class="row slider">
          <span class="slend">縮</span>

  <!-- ============ プレビュー ============ -->
